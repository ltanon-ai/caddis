# caddis — canonical etalon CI.
#
# Adopts the full fleet quality/security/supply-chain/ai-guard suite from the
# etalon (varliukai/infra_pipeline_gitlab), PINNED to a full SHA (the pin is
# load-bearing — never point ref back at 'main'). Superstrict: LINT/SEC/AI =
# all; every job blocks, nothing is permitted to fail silently (operator
# directive: fix every finding at source or surface it as a blocker).
#
# caddis is a zero-dependency Rust workspace (three first-party crates) plus
# a TypeScript adapter, shell onboarding script, Python asset renderer and
# markdown docs. The etalon covers it: lint:rust (clippy+rustfmt via
# gitlab-report), lint:shellcheck, lint:typos, lint:markdown, sec:gitleaks,
# supply-chain, ai-guard, ai-scans, fix-suggestions. No project-local gates.
#
# Runs ONLY on the operator's muhbot workers (varliukai-pool-1..5 group
# runners, tag: muhbot) — shared runners are disabled on this project so no
# job escapes to GitLab's shared fleet.
#
# Required CI/CD variables (set once per consumer project, same token fleet-wide):
#   AI_SCANS_PROJ_ID   numeric ID of varliukai/infra_pipeline_gitlab (82038685)
#   AI_SCANS_TOKEN     glpat with read_api (masked) — fetches the ai-scan engines
#   POST_SUGGESTIONS_URL  raw URL of scripts/post-suggestions.sh at a stable ref

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

include:
  - project: 'varliukai/infra_pipeline_gitlab'
    ref: '7c6aecbe4e190a6503cdc39cd5df145991347bcc'
    file:
      - 'ci-templates/all.yml'
      - 'ci-templates/lint.yml'
      - 'ci-templates/security.yml'
      - 'ci-templates/supply-chain.yml'
      - 'ci-templates/quality.yml'
      - 'ci-templates/ai-guard.yml'
      - 'ci-templates/ai-scans.yml'
      - 'ci-templates/fix-suggestions.yml'
      - 'ci-templates/reporting.yml'

variables:
  # Superstrict canonical blocking matrix — never weaken, suppress nothing.
  LINT_BLOCK: 'all'
  SEC_BLOCK: 'all'
  AI_BLOCK: 'all'

# ── lint:rust override — TEMPORARY LOCAL REPAIR of an etalon defect ──────────
# caddis is the fleet's FIRST root-Cargo consumer of lint:rust; on
# rust:1.82-alpine the etalon's `cargo install gitlab-report --quiet` step
# exits after ~22s with no output and no binary, and the job dies at
# `gitlab-report: not found` (job 16053614870). The GATE below is unchanged
# in strictness — clippy with -D warnings and rustfmt --check still decide
# pass/fail — only the codequality rendering is best-effort. Tracked
# upstream: infra_pipeline_gitlab issue (pin-bump ritual when fixed).
lint:rust:
  stage: lint
  image: ${DOCKER_IMAGE_PREFIX}rust:1.82-alpine
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    CARGO_NET_RETRY: "5"
  cache:
    key: "caddis-rust-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/
      - target/
  rules:
    - if: '$SKIP_CLIPPY == "true"'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      set -e
      i=0; until apk add --no-cache musl-dev; do
        i=$((i+1)); [ "$i -ge 3" ] && exit 1
        echo "apk add: transient (try $i/3), retrying in 5s..."; sleep 5
      done
      [ -f Cargo.toml ] || { echo "No Cargo.toml — skipping"; echo '[]' > gl-rust-report.json; exit 0; }
      rustup component add clippy rustfmt
      # LOUD install with explicit success check — the etalon's --quiet step
      # failed silently (see header). Rendering is best-effort; the gate is
      # clippy itself below.
      GR_OK=0
      cargo install gitlab-report --locked 2>&1 | tail -5 || GR_OK=1
      echo '[]' > gl-rust-report.json
      cargo clippy --all-targets --all-features -- -D warnings
      cargo fmt --all -- --check
      if [ "$GR_OK" = "0" ] && command -v gitlab-report >/dev/null 2>&1; then
        cargo clippy --all-targets --all-features --message-format=json \
          > /tmp/clippy-raw.json 2>/dev/null || true
        gitlab-report -p clippy < /tmp/clippy-raw.json > gl-rust-report.json || echo '[]' > gl-rust-report.json
      else
        echo "note: gitlab-report unavailable — codequality rendering skipped, gate unchanged"
      fi
  artifacts:
    when: always
    reports:
      codequality: gl-rust-report.json
