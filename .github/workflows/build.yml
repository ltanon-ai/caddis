name: build

# Universal platform proof: build, test, and self-prove on all three OSes.
# On a v* tag, package the binaries for every platform and attach them (with
# SHA256SUMS) to the GitHub release. workflow_dispatch lets the same release
# path be run for an already-published tag (input: tag).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to attach artifacts to (release path)"
        required: false

permissions:
  contents: write

jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Pinned to full commit SHAs (supply-chain law): a mutable tag or
      # branch can be silently repointed by the action owner. Refresh =
      # resolve the tag/branch to its SHA, one line each.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build
        run: cargo build --release -p caddis-warden
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Python tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q adapters/claude-code/test_warden_gate.py \
            skills/caddis/test_ladder.py tools/test_sonar_coverage.py
      - name: Test
        run: cargo test --workspace
      - name: Self-proof (deny + allow + ledger row)
        run: |
          mkdir -p "$HOME/.caddis/bin"
          if [ -f target/release/caddis-warden.exe ]; then
            cp target/release/caddis-warden.exe "$HOME/.caddis/bin/"
          else
            cp target/release/caddis-warden "$HOME/.caddis/bin/"
          fi
          . ./onboard
      - name: Package
        run: |
          mkdir -p dist
          if [ -f target/release/caddis-warden.exe ]; then
            cp target/release/caddis-warden.exe "dist/caddis-warden-${RUNNER_OS}-x64.exe"
          else
            cp target/release/caddis-warden "dist/caddis-warden-${RUNNER_OS}-x64"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: caddis-${{ matrix.os }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 (>=4.1.3, GHSA-cxww-7g56-2vh6 patched)
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum caddis-warden-* > SHA256SUMS
          cat SHA256SUMS
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" dist/* --clobber
