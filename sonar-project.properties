# SonarQube wiring (operator ruling 2026-08-24, option 1: the coverage
# pipeline). The pre-push gate requires BOTH scans clean; this file feeds
# the scanner real coverage instead of an empty denominator.
# Prerequisites: pip install pytest pytest-cov defusedxml pillow.
# ⛔ WHICH tests to run is NOT restated here. The authority is the "Python
# tests" step in .github/workflows/build.yml — copy its file list verbatim and
# add the --cov flags below. This list used to be spelled out in THREE places
# (that workflow, this file, and tools/sonar-coverage.py) and drifted twice:
# once leaving test_gen_book.py out of CI, once leaving test_install_skill.py
# out of coverage. A set duplicated three ways is a set that will diverge.
#   python -m pytest -q <the file list from build.yml> \
#     --cov=skills/caddis --cov=adapters/claude-code --cov=tools \
#     --cov-report=xml:.sonar-scan/coverage-python.xml
#   cargo llvm-cov --lcov --output-path .sonar-scan/coverage-rust.lcov
#   python tools/sonar-coverage.py
# (sonar-coverage.py makes cobertura sources project-relative for the
# Linux scanner container and converts the lcov to the generic XML.)
# The calibration fixtures are deliberately-red stubs (written exception,
# adapters/README.md) and never were a coverage target.
sonar.python.coverage.reportPaths=.sonar-scan/coverage-python.xml
sonar.coverageReportPaths=.sonar-scan/coverage-rust-generic.xml
sonar.coverage.exclusions=**/calibration/fixtures/**
# The same fixtures are excluded from ISSUE analysis. They are deliberately
# unimplemented stubs - the unused parameters and the TODO markers ARE the
# exercise a local model is dispatched to complete (skills/caddis/calibration).
# Implementing them to satisfy a linter would delete the calibration pack.
sonar.exclusions=**/calibration/fixtures/**
